name: Android
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Build, test and lint
        run: ./gradlew build testDebugUnitTest lint assembleDebug --max-workers=2 --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-*.html
      - uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Release input APK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-release-input
          path: app/build/outputs/apk/release/app-release-unsigned.apk
  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'build-tools;36.0.0'
      - uses: actions/download-artifact@v4
        with:
          name: unsigned-release-input
          path: unsigned
      - name: Load signing key
        env:
          APK_SIGNING_KEYSTORE_BASE64: ${{ secrets.APK_SIGNING_KEYSTORE_BASE64 }}
        run: |
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          key = Path(os.environ['RUNNER_TEMP']) / 'bridge-release.keystore'
          key.write_bytes(base64.b64decode(os.environ['APK_SIGNING_KEYSTORE_BASE64'], validate=True))
          key.chmod(0o600)
          PY
      - name: Sign and verify release
        env:
          APK_SIGNING_PASSWORD: ${{ secrets.APK_SIGNING_PASSWORD }}
        run: |
          export APK_SIGNING_KEYSTORE="$RUNNER_TEMP/bridge-release.keystore"
          python3 tools/sign_release.py --sdk "$ANDROID_HOME" --unsigned unsigned/app-release-unsigned.apk --tag "$GITHUB_REF_NAME" --output-dir release
      - name: Publish Obtainium-compatible GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/*.apk release/SHA256SUMS --clobber
          else
            gh release create "$GITHUB_REF_NAME" release/*.apk release/SHA256SUMS --verify-tag --latest --title "Kvaesitso Bridge ${GITHUB_REF_NAME#v}" --generate-notes
          fi
      - name: Remove runner signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/bridge-release.keystore"
